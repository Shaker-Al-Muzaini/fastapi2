<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if title %}
          Fast_Api _   {{ title }}
        {% else %}
            Home
        {% endif %}
    </title>
</head>
<body>
    {% for post in  posts %}
    <table class="table table-striped">
        <tr>
            <th>id</th>
            <th>author</th>
            <th>title</th>
            <th>content</th>
            <th>date_posted</th>
            </tr>
            
                <tr>
                    <td>{{post.id}}</td>
                    <td>{{post.author}}</td>
                    <td>{{post.title}}</td>
                    <td>{{post.content}}</td>
                    <td>{{post.date_posted}}</td>
                </tr>
            
          {%endfor%}
    </table>
    
</body>
</html>
