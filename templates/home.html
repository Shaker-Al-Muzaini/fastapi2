{% extends "layout.html" %} 
{% block content %} 
    {% for post in posts %} 
        <article class="content-section py-3 px-4 mb-4"> 
            <div class="d-flex align-items-start gap-4"> 
            <a class="me-2 fw-bold text-decoration-none" href="{{ url_for('user_profile', user_id=post.author.id) }}">
                    <img class="rounded-circle article-img flex-shrink-0" 
                         src="{{ post.author.image_path }}" 
                         alt="{{ post.author.username }}'s profile picture" 
                         width="64" 
                         height="64" 
                         loading="lazy"
                         style="object-fit: cover;"> 
                </a>    


                <div class="flex-grow-1"> 
                    <!-- معلومات كاتب المقال والتاريخ -->
                    <div class="article-metadata mb-2"> 
                        <a class="me-2 fw-bold text-decoration-none" href="{{ url_for('user_posts', user_id=post.author.id) }}">
                            {{ post.author.username }}
                        </a> 
                        <small class="text-body-secondary">{{ post.date_posted.strftime("%B %d, %Y") }}</small> 
                    </div> 
                    
                    <!-- عنوان المقال -->
                    <h2> 
                     <a class="article-title text-decoration-none text-body" href="{{ url_for('post_page', post_id=post.id) }}">
                        {{ post.title }}
                      </a> 
                    </h2> 
                    
                    <!-- محتوى المقال -->
                    <p class="article-content text-muted mt-2">{{ post.content }}</p> 
                </div> 
            </div> 
        </article> 
    {% endfor %} 
{% endblock content %}
